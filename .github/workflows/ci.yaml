name: CI

on:
    pull_request:
    push:
        branches:
            - master
            - 2.x
            - 3.x

jobs:
    run:
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                php:
                    - '8.2'
                    - '8.3'
                    - '8.4'
                    - '8.5'
                symfony-versions: [false]
                include:
                    -   description: 'Symfony 7.4 LTS'
                        php: '8.4'
                        symfony-versions: '^7.4'
        name: PHP ${{ matrix.php }} ${{ matrix.description }}
        steps:
            - name: Checkout
              uses: actions/checkout@v6

            - uses: actions/cache@v5
              with:
                  path: ~/.composer/cache/files
                  key: composer-${{ matrix.php }}-${{ matrix.symfony-versions }}-${{ hashFiles('composer.json') }}
                  restore-keys: |
                    composer-${{ matrix.php }}-
                    composer-

            - name: Setup PHP
              uses: shivammathur/setup-php@v2
              with:
                  php-version: ${{ matrix.php }}

            - name: Install symfony/flex
              run: composer config --global --no-plugins allow-plugins.symfony/flex true && composer global require symfony/flex
              if: matrix.symfony-versions

            - name: Install dependencies
              env:
                SYMFONY_REQUIRE: ${{ matrix.symfony-versions }}
              run: composer update

            - name: Run PHPUnit tests
              run: ./vendor/bin/phpunit
